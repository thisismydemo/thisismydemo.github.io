{{ define "main" }}
<script>
	if (window.location.pathname.startsWith('/azure-scout/')) {
		const suffix = window.location.pathname.slice('/azure-scout/'.length);
		const destination = new URL(suffix, 'https://hybrid-solutions-cloud.github.io/azure-scout/');
		destination.search = window.location.search;
		destination.hash = window.location.hash;
		window.location.replace(destination);
	}
</script>
<main class="main" role="main">
	<div class="warning">
		<h1 class="warning__headline">{{ T "404_title" }}</h1>
		<p class="warning__text">{{ T "404_text" }} <a href="{{ "" | relLangURL }}">{{ T "404_linktext" }}</a>.</p>
	</div>
</main>
{{ end }}
