<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="AzL Sonar: real-time monitor for Azure Local deployments">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041B2D"/>
      <stop offset="60%" stop-color="#0B3D5C"/>
      <stop offset="100%" stop-color="#0E6E8C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- sonar rings -->
  <g fill="none" stroke="#5FE0D0" transform="translate(960,315)">
    <circle r="60" stroke-width="3" opacity="0.9"/>
    <circle r="130" stroke-width="2.5" opacity="0.55"/>
    <circle r="200" stroke-width="2" opacity="0.32"/>
    <circle r="270" stroke-width="1.5" opacity="0.18"/>
    <line x1="0" y1="0" x2="190" y2="-110" stroke-width="3" opacity="0.8"/>
  </g>
  <circle cx="960" cy="315" r="9" fill="#5FE0D0"/>
  <circle cx="1052" cy="246" r="7" fill="#2ECC71"/>
  <circle cx="884" cy="398" r="7" fill="#2ECC71"/>
  <circle cx="1040" cy="420" r="7" fill="#F5B041"/>

  <text x="80" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#8FE9DD" letter-spacing="3">AZURE LOCAL TOOLS</text>
  <text x="80" y="250" font-family="'Segoe UI', Arial, sans-serif" font-size="92" font-weight="700" fill="#FFFFFF">AzL Sonar</text>
  <text x="82" y="312" font-family="'Segoe UI', Arial, sans-serif" font-size="34" fill="#FFFFFF" opacity="0.92">Watch an Azure Local deployment</text>
  <text x="82" y="356" font-family="'Segoe UI', Arial, sans-serif" font-size="34" fill="#FFFFFF" opacity="0.92">while it runs</text>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">
    <rect x="80" y="440" width="150" height="50" rx="10" fill="#FFFFFF" opacity="0.14"/>
    <text x="155" y="472" text-anchor="middle">Read-only</text>
    <rect x="246" y="440" width="190" height="50" rx="10" fill="#FFFFFF" opacity="0.14"/>
    <text x="341" y="472" text-anchor="middle">Nothing to install</text>
    <rect x="452" y="440" width="130" height="50" rx="10" fill="#FFFFFF" opacity="0.14"/>
    <text x="517" y="472" text-anchor="middle">Live logs</text>
    <rect x="598" y="440" width="190" height="50" rx="10" fill="#FFFFFF" opacity="0.14"/>
    <text x="693" y="472" text-anchor="middle">Record and replay</text>
  </g>
  <text x="80" y="560" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#FFFFFF" opacity="0.75">Every step, every machine, every log line, in one local page.</text>
</svg>
